<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1420">
<title>Tareas — NeuralCrew Labs</title>
<style>
:root{
  --bg:#0E1420; --panel:#151C2B; --panel2:#1B2436; --line:#26314A;
  --txt:#E8ECF4; --dim:#8A96AD; --gold:#D4AF37; --gold2:#F0D27A;
  --jona:#4C8DFF; --chucho:#43C08A; --shared:#8A96AD;
  --alta:#FF6B6B; --media:#F0B429; --baja:#5B6779;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
a{color:var(--gold)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0E1420f2,#0E1420d9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{font-size:16px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.sub{color:var(--dim);font-size:11.5px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--chucho);animation:p 2.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
.stats{display:flex;gap:8px;margin-top:11px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.stat b{display:block;font-size:19px;line-height:1.1}
.stat span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.stat.j b{color:var(--jona)} .stat.c b{color:var(--chucho)} .stat.d b{color:var(--txt)}
main{padding:12px 12px 0;display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){main{grid-template-columns:1fr 1fr 1fr;padding:16px;align-items:start}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:none}
.col.active{display:block}
@media(min-width:900px){.col{display:block}}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.col-h .bar{width:4px;height:20px;border-radius:2px}
.col-h h2{font-size:13px;font-weight:600;flex:1}
.col-h .n{font-size:11px;color:var(--dim);background:#0E1420;border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.owner-j .bar{background:var(--jona)} .owner-c .bar{background:var(--chucho)} .owner-s .bar{background:var(--shared)}
ul{list-style:none}
li.item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid #1E2739;align-items:flex-start;position:relative}
li.item:last-child{border-bottom:none}
li.item.done{opacity:.45}
li.item.done .t{text-decoration:line-through}
li.item.busy .t{color:var(--gold2)}
.chk{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.6px solid #37445F;background:transparent;display:grid;place-items:center;cursor:pointer;transition:.15s;margin-top:1px}
.chk:active{transform:scale(.9)}
.chk.on{background:var(--chucho);border-color:var(--chucho)}
.chk.on::after{content:"";width:9px;height:5px;border-left:2px solid #0E1420;border-bottom:2px solid #0E1420;transform:rotate(-45deg) translate(1px,-1px)}
.body{flex:1;min-width:0}
.t{font-size:14px;line-height:1.35;word-wrap:break-word;cursor:pointer}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.b{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.b.alta{color:var(--alta);border-color:#3d2529;background:#2a181c}
.b.media{color:var(--media);border-color:#3d3423;background:#2a2418}
.b.baja{color:var(--baja)}
.b.curso{color:var(--gold2);border-color:#3d3623;background:#2a2418}
.b.id{font-family:ui-monospace,monospace;color:#6F7B93}
.note{display:none;margin-top:8px;font-size:12px;color:var(--dim);border-left:2px solid var(--line);padding-left:8px;line-height:1.4}
li.item.open .note{display:block}
.acts{display:none;gap:8px;margin-top:9px;flex-wrap:wrap}
li.item.open .acts{display:flex}
.act{font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#0E1420;color:var(--dim);cursor:pointer}
.act:hover{color:var(--txt);border-color:#37445F}
.act.danger{color:#C97A7A}
.add{padding:11px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.add input{width:100%;background:#0E1420;border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:9px;font-size:13.5px;font-family:inherit}
.add input:focus{outline:none;border-color:var(--gold)}
.add input::placeholder{color:#5A6579}
.tabs{display:flex;gap:6px;padding:10px 12px 0}
@media(min-width:900px){.tabs{display:none}}
.tab{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12px;cursor:pointer;text-align:center}
.tab.on{background:var(--panel2);color:var(--txt);border-color:var(--gold)}
.empty{padding:22px 14px;color:#5A6579;font-size:12.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:50;box-shadow:0 8px 30px #0008}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast button{background:none;border:none;color:var(--gold);margin-left:10px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span> Tareas · NeuralCrew Labs</h1>
  <div class="sub">
    <span><span class="pulse"></span> en vivo</span>
    <span id="upd">—</span>
    <span id="who"></span>
  </div>
  <div class="stats">
    <div class="stat j"><b id="nj">0</b><span>Jonathan</span></div>
    <div class="stat c"><b id="nc">0</b><span>Chucho</span></div>
    <div class="stat d"><b id="nd">0</b><span>Abiertas</span></div>
  </div>
</header>

<div class="tabs">
  <div class="tab on" data-t="jonathan">Jonathan</div>
  <div class="tab" data-t="chucho">Chucho</div>
  <div class="tab" data-t="compartido">Compartido</div>
</div>

<main>
  <section class="col owner-j active" data-o="jonathan">
    <div class="col-h"><span class="bar"></span><h2>Jonathan</h2><span class="n" id="cj">0</span></div>
    <ul id="lj"></ul>
    <div class="add"><input placeholder="+ añadir tarea a Jonathan" data-o="jonathan"></div>
  </section>
  <section class="col owner-c" data-o="chucho">
    <div class="col-h"><span class="bar"></span><h2>Chucho</h2><span class="n" id="cc">0</span></div>
    <ul id="lc"></ul>
    <div class="add"><input placeholder="+ añadir tarea a Chucho" data-o="chucho"></div>
  </section>
  <section class="col owner-s" data-o="compartido">
    <div class="col-h"><span class="bar"></span><h2>Compartido</h2><span class="n" id="cs">0</span></div>
    <ul id="ls"></ul>
    <div class="add"><input placeholder="+ añadir tarea compartida" data-o="compartido"></div>
  </section>
</main>

<div id="toast"><span id="toast-t"></span><button id="undo" hidden>Deshacer</button></div>

<script>
const LISTS = {jonathan:'lj', chucho:'lc', compartido:'ls'};
const COUNTS = {jonathan:'cj', chucho:'cc', compartido:'cs'};
let data = {items:[], meta:{}};
let lastMtime = 0, undoBuf = null, undoId = null;

const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, undoFn){
  const t = document.getElementById('toast'), b = document.getElementById('undo');
  document.getElementById('toast-t').textContent = msg;
  b.hidden = !undoFn;
  if(undoFn){ b.onclick = () => { undoFn(); hideToast(); }; }
  t.classList.add('on');
  clearTimeout(undoId);
  undoId = setTimeout(hideToast, undoFn ? 5000 : 2200);
}
function hideToast(){ document.getElementById('toast').classList.remove('on'); clearTimeout(undoId); }

async function api(method, path, body){
  const r = await fetch(path, {
    method, headers:{'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  let j = {}; try { j = await r.json(); } catch(e){}
  if(!r.ok && r.status !== 409) throw new Error(j.error || ('HTTP '+r.status));
  return {status:r.status, ...j};
}

function row(it){
  const li = document.createElement('li');
  li.className = 'item' + (it.estado==='en_curso'?' busy':'');
  li.dataset.id = it.id;
  li.innerHTML = `
    <button class="chk" aria-label="cerrar"></button>
    <div class="body">
      <div class="t">${esc(it.tarea)}</div>
      <div class="badges">
        <span class="b id">${esc(it.id)}</span>
        <span class="b ${esc(it.prioridad||'media')}">${esc(it.prioridad||'media')}</span>
        <span class="b">${esc(it.area||'general')}</span>
        ${it.estado==='en_curso'?'<span class="b curso">en curso</span>':''}
        ${it.alta?`<span class="b">${esc(it.alta)}</span>`:''}
      </div>
      ${it.nota?`<div class="note">${esc(it.nota)}</div>`:''}
      <div class="acts">
        <button class="act" data-a="curso">${it.estado==='en_curso'?'Pausar':'Empezar'}</button>
        <button class="act danger" data-a="del">Quitar</button>
      </div>
    </div>`;
  li.querySelector('.t').onclick = () => li.classList.toggle('open');
  li.querySelector('.chk').onclick = () => toggle(it, li);
  li.querySelector('[data-a="curso"]').onclick = () => setEstado(it, it.estado==='en_curso'?'abierto':'en_curso');
  li.querySelector('[data-a="del"]').onclick = () => quitar(it);
  return li;
}

function render(){
  const by = {jonathan:[], chucho:[], compartido:[]};
  for(const it of data.items){
    const o = by[it.dueno] ? it.dueno : 'compartido';
    by[o].push(it);
  }
  for(const o of Object.keys(LISTS)){
    const ul = document.getElementById(LISTS[o]);
    ul.innerHTML = '';
    by[o].sort((a,b)=>{
      const p = {alta:0,media:1,baja:2};
      return (p[a.prioridad]??1)-(p[b.prioridad]??1) || a.id.localeCompare(b.id);
    });
    if(!by[o].length) ul.innerHTML = '<li class="empty">Sin pendientes</li>';
    by[o].forEach(it => ul.appendChild(row(it)));
    document.getElementById(COUNTS[o]).textContent = by[o].length;
  }
  const m = data.meta || {};
  document.getElementById('nj').textContent = (m.por_dueno?.jonathan?.total ?? 0);
  document.getElementById('nc').textContent = (m.por_dueno?.chucho?.total ?? 0);
  document.getElementById('nd').textContent = m.abiertas ?? 0;
  if(m.actualizado){
    const d = new Date(m.actualizado);
    document.getElementById('upd').textContent = 'act. ' + d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  }
}

async function load(force){
  try{
    const j = await fetch('api/tasks', {cache:'no-store'}).then(r=>r.json());
    if(!force && j.meta && j.meta.mtime === lastMtime) return;
    lastMtime = j.meta?.mtime ?? 0;
    data = j; render();
  }catch(e){ /* silencio: se reintenta en el próximo ciclo */ }
}

async function toggle(it, li){
  const antes = {...it};
  try{
    if(it.estado === 'cerrado') return;
    await api('POST', `api/tasks/${it.id}/close`, {evidencia:`Cerrada por ${whoami()} desde el portal`});
    li.classList.add('done');
    toast(`Cerrada ${it.id}`, async ()=>{
      await api('PATCH', `api/tasks/${it.id}`, {estado: antes.estado || 'abierto'});
      load(true);
    });
    setTimeout(()=>load(true), 400);
  }catch(e){ toast('No se pudo cerrar: '+e.message); load(true); }
}

async function setEstado(it, estado){
  try{
    await api('PATCH', `api/tasks/${it.id}`, {estado});
    load(true);
  }catch(e){ toast('No se pudo cambiar: '+e.message); }
}

async function quitar(it){
  if(!confirm(`¿Quitar ${it.id}?\n\n${it.tarea}\n\nNo se borra: se cierra con registro.`)) return;
  try{
    await api('DELETE', `api/tasks/${it.id}`);
    toast(`Quitada ${it.id}`);
    load(true);
  }catch(e){ toast('No se pudo quitar: '+e.message); }
}

function whoami(){ return document.getElementById('who').textContent || 'portal'; }

document.querySelectorAll('.add input').forEach(inp => {
  inp.addEventListener('keydown', async ev => {
    if(ev.key !== 'Enter') return;
    const t = inp.value.trim(); if(!t) return;
    try{
      const r = await api('POST','api/tasks',{tarea:t, dueno:inp.dataset.o});
      if(r.status === 409){ toast(`Ya existe: ${r.id}`); return; }
      inp.value = '';
      toast(`Añadida ${r.item?.id||''}`);
      load(true);
    }catch(e){ toast('No se pudo añadir: '+e.message); }
  });
});

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.querySelectorAll('.col').forEach(c=>c.classList.toggle('active', c.dataset.o === t.dataset.t));
  };
});

fetch('api/health').then(r=>r.json()).then(j=>{
  document.getElementById('who').textContent = j.actor || '';
}).catch(()=>{});

load(true);
setInterval(()=>load(false), 10000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(false); });
</script>
</body>
</html>
