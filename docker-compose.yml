services:
  hermes:
    build: .
    image: hermes-agent-hermes:v0.22.0-ncl
    container_name: hermes-agent
    ports:
      - "100.73.30.29:3000:3000"
      - "100.73.30.29:9119:9119"
    environment:
      - TZ=America/Bogota
      - HOME=/opt/data/home
      - HERMES_UID=10000
      - HERMES_GID=10000
      - ENGRAM_DATA_DIR=/opt/data/home/.engram
    volumes:
      - ./data:/opt/data
      - /root/.engram:/opt/data/home/.engram
      - /home/linuxbrew/.linuxbrew/Cellar/engram/1.20.0/bin/engram:/usr/local/bin/engram:ro
      - /home/linuxbrew/.linuxbrew/Cellar/gentle-ai/2.3.0/bin/gentle-ai:/usr/local/bin/gentle-ai:ro
      - ./tools/mcp_tool.py:/opt/hermes/tools/mcp_tool.py:ro
      - ./plugins/observability/langfuse/__init__.py:/opt/hermes/plugins/observability/langfuse/__init__.py:ro
      - /root/golden-game-landing:/opt/repos/golden-game-landing:ro
      - /opt/ai-platform:/opt/repos/ai-platform:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/vault:/opt/vault:ro
      - /root/tools/graphs:/opt/graphs:ro
      - /opt/vps-brain:/opt/vps-brain
    env_file:
      - .env
      - ./data/.env
    restart: unless-stopped
    command: ["gateway", "run"]
    stdin_open: true
    tty: true
    networks:
      - default
      - twenty_default

networks:
  default:
  twenty_default:
    external: true
